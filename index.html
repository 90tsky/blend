<!doctype html>
<html lang="en-GB" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efee" />
    <!-- Inside another page (the portfolio's phone preview): no scrollbars, as on a phone (base.css, html.is-embedded).
         Set before the first paint, so the page never lays out round one. -->
    <script>if (window.top !== window.self) document.documentElement.classList.add('is-embedded')</script>
    <!-- The saved appearance (Menu › Appearance: light, dark or auto) before the first paint, so a dark page doesn't
         open light for a moment. The store keeps it up to date after that (store.tsx). -->
    <script>try { var t = JSON.parse(localStorage.getItem('blend:v2') || '{}').theme; if (t === 'dark' || t === 'auto') document.documentElement.dataset.theme = t } catch (e) {}</script>
    <meta name="description" content="blend: a capsule wardrobe shop where every top goes with every bottom. Mix them in the change room before you buy." />
    <title>blend</title>
    <link rel="icon" href="/brand/logo.svg" />
    <!-- Home-screen app: the manifest's scope is all of /blend/, so every screen stays inside the app (without it,
         iOS took the range from the saved page, e.g. /blend/events/, and opened the change room in a browser view). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="blend" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- UI font, every weight the app uses -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&display=swap"
    />
    <!-- One display font per event banner, as in the Figma file. Each loads only the letters of its own title (text=, one
         request each, since text= covers every font in a request), so a font is a few KB, not the whole alphabet.
         If a title changes in src/data/events.ts, or the banner CSS changes its case, change its text= too. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Notable&text=Casual&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&text=Outdoors&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&text=Office%20hours&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kranky&text=Day%20off&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&text=Maternity&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&text=Working%20out&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&text=Night%20out&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&text=Beach%20day&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
